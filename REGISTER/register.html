<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>User Registration - Digital Library</title>

    <link rel="stylesheet" href="./register.css">

</head>

<body>

    <!-- ============================= -->
    <!-- MAIN CONTAINER -->
    <!-- ============================= -->

    <div class="container">


        <!-- ============================= -->
        <!-- HEADER -->
        <!-- ============================= -->

        <header class="header">

            <h3>ACCOUNT CREATION</h3>

            <h1>
                User Registration
            </h1>

        </header>


        <!-- ============================= -->
        <!-- REGISTER CONTENT -->
        <!-- ============================= -->

        <main class="content">

            <form id="registerForm">


                <!-- ============================= -->
                <!-- USER NAME -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="userName">
                        User Name
                    </label>

                    <input
                        type="text"
                        id="userName"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- ============================= -->
                <!-- USER EMAIL -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="userEmail">
                        User Email
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- ============================= -->
                <!-- USER PHONE -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="userPhone">
                        User Phone Number
                    </label>

                    <input
                        type="tel"
                        id="userPhone"
                        placeholder="Enter your phone number"
                        required>

                </div>


                <!-- ============================= -->
                <!-- USER ADDRESS -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="userAddress">
                        User Address
                    </label>

                    <textarea
                        id="userAddress"
                        placeholder="Enter your address"
                        required></textarea>

                </div>


                <!-- ============================= -->
                <!-- USER PASSWORD -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="userPassword">
                        User Password
                    </label>

                    <input
                        type="password"
                        id="userPassword"
                        placeholder="Enter a password"
                        required>

                </div>


                <!-- ============================= -->
                <!-- REGISTER BUTTON -->
                <!-- ============================= -->

                <button
                    type="submit"
                    class="btn">

                    Register Account

                </button>

            </form>


            <!-- ============================= -->
            <!-- LOGIN LINK -->
            <!-- ============================= -->

            <p class="link-text">

                Already have an account?

                <a href="../LOGIN/login.html">
                    Login Here
                </a>

            </p>


            <!-- ============================= -->
            <!-- BACK HOME -->
            <!-- ============================= -->

            <button
                class="secondary-btn"
                id="backHomeBtn">

                ← Back to Home

            </button>

        </main>

    </div>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="./register.js"></script>

</body>

</html>
