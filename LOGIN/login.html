<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>User Login - Digital Library</title>

    <link rel="stylesheet" href="./login.css">

</head>

<body>

    <!-- ============================= -->
    <!-- MAIN CONTAINER -->
    <!-- ============================= -->

    <div class="container">

        <!-- ============================= -->
        <!-- HEADER -->
        <!-- ============================= -->

        <header class="header">

            <h3>PORTAL ACCESS</h3>

            <h1>
                User Login
            </h1>

        </header>


        <!-- ============================= -->
        <!-- LOGIN CONTENT -->
        <!-- ============================= -->

        <main class="content">

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        User Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="loginPassword">
                        User Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn">

                    Login

                </button>

            </form>


            <!-- ============================= -->
            <!-- REGISTER LINK -->
            <!-- ============================= -->

            <p class="link-text">

                New User?

                <a href="../REGISTER/register.html">
                    Register Here
                </a>

            </p>


            <!-- ============================= -->
            <!-- BACK TO HOME -->
            <!-- ============================= -->

            <button
                class="secondary-btn"
                id="backHomeBtn">

                ← Back to Home

            </button>

        </main>

    </div>


    <!-- JAVASCRIPT -->

    <script src="./login.js"></script>

</body>

</html>
